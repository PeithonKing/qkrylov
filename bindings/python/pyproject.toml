[build-system]
requires = [
    "scikit-build-core>=1.0",
    "nanobind>=2.0",
    "setuptools-scm>=8"
]
build-backend = "scikit_build_core.build"

[project]
name = "qkrylov"
dynamic = ["version"]
description = "Python interface for qkrylov"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "qkrylov contributors" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "numpy"
]

[project.optional-dependencies]
test = [
    "pytest"
]
docs = [
    "mkdocs",
    "mkdocs-material"
]

[project.urls]
Homepage = "https://github.com/sjp95/qkrylov"
Documentation = "https://sjp95.github.io/qkrylov/"
Issues = "https://github.com/sjp95/qkrylov/issues"

[tool.scikit-build]
cmake.source-dir = "../.."
wheel.packages = []

[tool.scikit-build.cmake.define]
QKRYLOV_BUILD_TESTS = "OFF"
QKRYLOV_BUILD_PYTHON = "ON"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
