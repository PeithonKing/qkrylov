[project]
site_url = "https://sjp95.github.io/qkrylov/"
site_name = "qkrylov"
site_description = "Matrix-free quantum exact diagonalization & dynamics engine in modern C++ and Python."
repo_url = "https://github.com/sjp95/qkrylov"
repo_name = "qkrylov/qkrylov"

nav = [
  { "Home" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Models" = [
    { "Overview" = "models/index.md" },
    { "Spin-1/2" = "models/spin.md" },
    { "Fermion" = "models/fermion.md" },
  ]},
  { "Solvers" = [
    { "Overview" = "solvers/index.md" },
    { "Lanczos" = "solvers/lanczos.md" },
    { "Davidson" = "solvers/davidson.md" },
    { "Spectral Functions" = "solvers/dynamics.md" },
    { "FTLM" = "solvers/ftlm.md" },
  ]},
  { "Theory" = [
    { "Overview" = "theory/index.md" },
    { "Exact Diagonalization" = "theory/exact_diag.md" },
    { "Krylov Methods" = "theory/krylov.md" },
    { "Spectral Functions" = "theory/spectral.md" },
  ]},
  { "API Reference" = "api/index.md" },
  { "Performance" = "performance.md" },
  { "Contributing" = "contributing.md" },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
