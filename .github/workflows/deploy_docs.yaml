name: Deploy Docs

'on':
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'          # markdown content changes
      - 'website/**'       # build tooling changes
      - '.github/workflows/deploy_docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'  # ← was docs/

      - name: Install dependencies
        working-directory: website                             # ← was docs
        run: npm ci

      - name: Build documentation
        working-directory: website                            # ← was docs
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist                                  # ← was docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
