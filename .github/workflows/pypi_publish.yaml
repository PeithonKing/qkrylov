name: Build and Publish Wheels

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0). Leave blank to auto-detect from git tag."
        required: false
        default: ""

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version string
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          fi
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build sdist
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }} pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build ${{ matrix.python.build }} on ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: windows-amd64
            os: windows-latest
            arch: AMD64
          - name: macos-x86_64
            os: macos-13
            arch: x86_64
          - name: macos-arm64
            os: macos-14
            arch: arm64
        python:
          - build: cp311-*
            py_api: ""
            tag: cp311
          - build: cp312-*
            py_api: cp312
            tag: cp312-abi3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compute the clean version string from the release tag (e.g. "v0.1.0" -> "0.1.0")
      # This is injected into the container so setuptools_scm gets the right version
      # even inside Docker where .git is not available.
      - name: Compute version string
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          fi
          # Strip leading 'v' prefix
          VER="${VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version: $VER"

      - name: Set up QEMU for Linux ARM64
        if: matrix.platform.arch == 'aarch64' && matrix.platform.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Install macOS OpenMP
        if: startsWith(matrix.platform.os, 'macos')
        run: brew install libomp

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: .
        env:
          CIBW_BUILD: ${{ matrix.python.build }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: ${{ matrix.platform.arch }}
          CIBW_TEST_COMMAND: "python -c \"import qkrylov; print(qkrylov.__version__)\""
          # Inject version into the build environment (works inside Docker too!)
          CIBW_ENVIRONMENT: >-
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
            SKBUILD_WHEEL_PY_API=${{ matrix.python.py_api }}
          CIBW_ENVIRONMENT_MACOS: >-
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.platform.os == 'macos-14' && '14.0' || '13.0' }}
          CIBW_ENVIRONMENT_WINDOWS: >-
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}
          CMAKE_PREFIX_PATH: "/opt/homebrew/opt/libomp:/usr/local/opt/libomp"
          SKBUILD_WHEEL_PY_API: ${{ matrix.python.py_api }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.platform.name }}-${{ matrix.python.tag }}
          path: ./wheelhouse/*.whl

  publish_and_index:
    name: Publish to PyPI and Generate Index
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qkrylov
    permissions:
      contents: write
      id-token: write
    if: (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: ./wheels
          pattern: cibw-wheels-*
          merge-multiple: true

      - name: List wheels being published
        run: ls -lh ./wheels/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./wheels

      - name: Upload wheels to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./wheels/*.whl

      - name: Generate Custom Index (PyTorch style)
        if: github.event_name == 'release'
        run: |
          python .github/scripts/generate_indexes.py ./wheels ${{ github.repository }} ${{ github.ref_name }}

      - name: Deploy Custom Index to gh-pages branch
        if: github.event_name == 'release'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./whl_out
          destination_dir: whl
          keep_files: true
