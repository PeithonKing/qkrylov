name: Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'bindings/python/**'
      - 'CMakeLists.txt'
      - '.github/workflows/tests.yaml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-cpp-and-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy scipy nanobind cmake

    - name: Build C++ and Python bindings
      run: |
        cmake -B build -S . -DQKRYLOV_BUILD_TESTS=ON -DQKRYLOV_BUILD_PYTHON=ON
        cmake --build build --config Release
        cp build/_qkrylov_cpp*.so bindings/python/qkrylov/
        pip install -e bindings/python

    - name: Run C++ tests
      run: |
        cd build && ctest --output-on-failure

    - name: Run Python tests
      run: |
        pytest bindings/python/tests/ -v
