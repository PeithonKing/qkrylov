name: Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'bindings/python/**'
      - 'bindings/julia/**'
      - 'CMakeLists.txt'
      - '.github/workflows/tests.yaml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-cpp-and-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy scipy nanobind cmake scikit-build-core

    - name: Build C++ tests
      run: |
        cmake -B build -S . -DQKRYLOV_BUILD_TESTS=ON -DQKRYLOV_BUILD_PYTHON=OFF
        cmake --build build --config Release

    - name: Install Python package
      run: |
        pip install bindings/python

    - name: Run C++ tests
      run: |
        cd build && ctest --output-on-failure

    - name: Run Python tests
      run: |
        TMP_TESTS="$(mktemp -d)"
        cp -R bindings/python/tests "$TMP_TESTS/tests"
        python -m pytest "$TMP_TESTS/tests" -v

  test-julia:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: '1.10'

    - name: Build C++ library
      run: |
        cmake -B build -S . -DBUILD_SHARED_LIBS=ON -DQKRYLOV_BUILD_TESTS=OFF
        cmake --build build --config Release

    - name: Run Julia tests
      run: |
        julia --project=bindings/julia -e 'using Pkg; Pkg.test()'

