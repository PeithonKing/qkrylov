name: Build and Publish Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build_cpu_wheels:
    name: Build CPU wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest: Linux
        # windows-latest: Windows
        # macos-13: Mac OS (Intel x86_64)
        # macos-14: Mac OS (Apple Silicon M-series ARM64)
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up QEMU for Linux ARM64 (aarch64) builds
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.17.0
        env:
          # CPU Artifacts 1-5:
          # Linux x86_64, Linux ARM64 (aarch64), Windows x86_64, Mac x86_64, Mac ARM64
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          
          # Skip older Pythons, PyPy, and musllinux (Alpine) to save CI time
          CIBW_SKIP: "cp36-* cp37-* cp38-* pp* *musllinux*"
          
          # Mac OS (Apple Clang) requires libomp for OpenMP support
          CIBW_BEFORE_ALL_MACOS: "brew install libomp"
          
          # Run the Python test suite natively on every compiled wheel!
          CIBW_TEST_REQUIRES: "pytest scipy numpy"
          CIBW_TEST_COMMAND: "pytest {project}/bindings/python/tests"

      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpu-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

